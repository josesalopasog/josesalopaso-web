    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#05050f" />

    <!-- Basic SEO, in Spanish (the default language; title + description switch to English at runtime when the visitor picks EN) -->
    <title>José Salopaso | Desarrollador Web Fullstack en Bogotá</title>
    <meta name="description" content="Desarrollador web fullstack en Bogotá: sitios rápidos, landing pages y aplicaciones web con React, Node.js y MongoDB. Cotiza al instante y te respondo en 24–48 h." />
    <meta name="keywords" content="José Salopaso, fullstack web developer, desarrollador web fullstack, freelance web developer Bogotá, desarrollador web Bogotá, MERN, React, Node.js, MongoDB, Express, landing page, portafolio, sistemas de gestión" />
    <meta name="author" content="José Salopaso" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp...) -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="José Salopaso | Desarrollador Web Fullstack en Bogotá" />
    <meta property="og:description" content="Sitios web, landing pages y aplicaciones web con React, Node.js y MongoDB. Cotiza al instante y te respondo en 24–48 h." />
    <meta property="og:image" content="https://josesalopaso.com/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portada de josesalopaso.com: José Salopaso frente a un atardecer con palmeras" />
    <meta property="og:url" content="https://josesalopaso.com" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="José Salopaso | Desarrollador Web Fullstack en Bogotá" />
    <meta name="twitter:description" content="Sitios web, landing pages y aplicaciones web con React, Node.js y MongoDB. Cotiza al instante y te respondo en 24–48 h." />
    <meta name="twitter:image" content="https://josesalopaso.com/preview.jpg" />

    <link rel="canonical" href="https://josesalopaso.com" />

    <!-- Structured data: tells search engines who this site is about -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "José Salopaso",
        "url": "https://josesalopaso.com",
        "image": "https://josesalopaso.com/preview.jpg",
        "jobTitle": "Fullstack Web Developer",
        "description": "Fullstack web developer and electronic engineer in Bogotá building websites, landing pages and web apps with the MERN stack.",
        "address": { "@type": "PostalAddress", "addressLocality": "Bogotá", "addressCountry": "CO" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Universidad Sergio Arboleda" },
        "knowsAbout": ["React", "Node.js", "MongoDB", "Express", "JavaScript", "TypeScript", "Web development", "Electronics", "Video editing", "Social media management"],
        "sameAs": [
          "https://github.com/josesalopasog",

    <!-- Loading screen: inline so it shows before the JS/CSS bundles arrive (src/main.jsx removes it).
         Same animation as the web_iter412 loader (its components/Spinner): the logo waits as a light
         grey/white outline, and a diagonal stripe slides across showing it in colour, like the
         Rockstar Games loader. -->
    <style>
      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05050f;
        transition: opacity 0.6s ease, visibility 0.6s;
      }

      #site-loader.is-done {
        opacity: 0;
        visibility: hidden;
      }

      .site-loader-logo {
        position: relative;
        width: min(130px, 34vw);
        aspect-ratio: 520 / 362;
      }

      .site-loader-logo img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* Rest: the logo always visible, in light grey (reads as a white outline on the dark background) */
      .site-loader-base {
        filter: grayscale(1) brightness(1.5) opacity(0.45);
      }

      /* The same logo in full colour, only visible through a diagonal stripe in the mask that travels from
         the top-left corner to the bottom-right one (both X and Y animate; the stripe is perpendicular to
         that diagonal). With the mask larger than the logo, a higher position % puts the stripe further
         up/left, so it goes from 95% (just outside the top-left corner) to 5% (just past the bottom-right). */
      .site-loader-shine {
        -webkit-mask-image: linear-gradient(135deg, transparent 42%, #fff 50%, transparent 58%);
        mask-image: linear-gradient(135deg, transparent 42%, #fff 50%, transparent 58%);
        -webkit-mask-size: 320% 320%;
        mask-size: 320% 320%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        animation: loader-sweep 2.4s ease-in-out infinite;
      }

      @keyframes loader-sweep {
        0% { -webkit-mask-position: 95% 95%; mask-position: 95% 95%; }
        55%, 100% { -webkit-mask-position: 5% 5%; mask-position: 5% 5%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .site-loader-shine {
          animation: none;
          -webkit-mask-image: none;
          mask-image: none;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div id="site-loader" role="status" aria-label="Cargando">
      <div class="site-loader-logo">
        <img class="site-loader-base" src="/loader-cyber.webp" alt="" />
        <img class="site-loader-shine" src="/loader-cyber.webp" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
